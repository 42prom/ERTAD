name: ertad

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
  logging: *logging
  networks: [private]

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ertad
      POSTGRES_USER: ertad_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:${ERTAD_POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ertad_owner -d ertad"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *logging
    networks: [private]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?Run npm run setup}" }
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction']
    ports: ["127.0.0.1:${ERTAD_REDIS_PORT:-16379}:6379"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [private]

  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: mini -dir=/data -ip=storage -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ertad_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run npm run setup}
      S3_BUCKET: ertad-attachments
    ports:
      - "127.0.0.1:${ERTAD_STORAGE_PORT:-19000}:8333"
    volumes: [storage_data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8333/healthz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging: *logging
    networks: [private]

  migrate:
    <<: *app
    profiles: [apps]
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: "no"
    command: [node, backend/dist/migrate.js]
    environment:
      MIGRATION_DATABASE_URL: postgresql://ertad_owner:${POSTGRES_PASSWORD:?Run npm run setup}@postgres:5432/ertad
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *app
    profiles: [apps]
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:${ERTAD_API_PORT:-13000}:3000"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://ertad_app:${APP_DB_PASSWORD:?Run npm run setup}@postgres:5432/ertad
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run npm run setup}@redis:6379/0
      STORAGE_HEALTH_URL: http://storage:8333/healthz
      WEB_ORIGIN: http://localhost:${ERTAD_WEB_PORT:-15173}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

  admin:
    <<: *app
    profiles: [apps]
    build: { context: ., dockerfile: admin/Dockerfile }
    ports: ["127.0.0.1:${ERTAD_WEB_PORT:-15173}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  private:
    driver: bridge
volumes:
  postgres_data:
  storage_data:
