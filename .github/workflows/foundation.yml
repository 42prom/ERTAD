name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check:workspace
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: docker compose --profile apps config --quiet
      - run: npm run stack:up
      - run: npm run smoke
      - run: npm run test:integration
      - run: npm run restore:drill
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        run: docker compose --profile apps down
